services:
  mysql:
    image: mysql:8.4
    container_name: chengliao-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat}
      MYSQL_USER: ${MYSQL_USER:-chengliao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE --execute='SELECT 1' --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
